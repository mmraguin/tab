<!DOCTYPE html>
<html lang="en" data-theme="playful">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="tab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>tab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <nav class="nav" id="nav" aria-label="Primary">
    <div class="nav-brand"><img src="Images/logo.png" alt="tab"></div>
    <button class="nav-item is-active" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-item" data-tab="accounts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>
      <span>Accounts</span>
    </button>
    <button class="nav-item" data-tab="activity">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span>Activity</span>
    </button>
    <button class="nav-item" data-tab="budget">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9l6.4 6.4M12 3a9 9 0 1 0 9 9h-9z"/></svg>
      <span>Budget</span>
    </button>
    <button class="nav-item" data-tab="goals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
      <span>Goals</span>
    </button>
    <button class="nav-item" data-tab="insights">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>
      <span>Insights</span>
    </button>
  </nav>

  <main class="main">
    <header class="top" id="top">
      <div class="period" role="group" aria-label="Month">
        <button class="icon-btn" id="prevM" aria-label="Previous month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="period-mid">
          <h1 class="period-label" id="mlabel">&nbsp;</h1>
        </div>
        <button class="icon-btn" id="nextM" aria-label="Next month">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" aria-label="Search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        </button>
        <button class="icon-btn" id="bellBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15zM10 21h4"/></svg>
          <span class="badge" id="bellBadge" hidden>0</span>
        </button>
        <button class="icon-btn" id="refresh" aria-label="Refresh data">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>
        </button>
      </div>
      <div class="searchbar" id="searchbar" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="gq" type="search" placeholder="Search anything" aria-label="Search transactions, categories, accounts and goals" autocomplete="off">
        <button class="icon-btn" id="gclose" aria-label="Close search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="results" id="results" hidden></div>
    </header>

    <div class="view" id="view"></div>
    <footer class="foot"><div class="sync" id="sync" role="status" aria-live="polite"></div></footer>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-grab" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle"></h2>
    <button class="icon-btn" id="sheetClose" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</section>

<a class="fab" id="fab" href="https://mmraguin.github.io/logger/" target="_blank" rel="noopener" aria-label="Open the logger to log a transaction">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Log</span>
</a>

<script src="app.js"></script>
</body>
</html>
