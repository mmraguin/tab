<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>tab</title>
<script>if(navigator.maxTouchPoints>0||'ontouchstart' in window)document.documentElement.classList.add('touch');</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="constellation" id="stars"></div>
<div class="app">
  <div class="hdr" id="hdr">
    <div class="hdr-l">
      <div class="mnav">
        <button class="marrow" onclick="changeMonth(-1)">&#8249;</button>
        <div class="mlabel" id="mlabel">---</div>
        <button class="marrow" onclick="changeMonth(1)">&#8250;</button>
      </div>
    </div>
    <div class="hdr-r">
      <div class="hbtn" id="dbgbtn" onclick="toggleDbg()" ontouchstart="">&#128269;</div>
      <div class="hbtn" id="refbtn" onclick="loadData()" ontouchstart="">&#8635;</div>
    </div>
  </div>
  
  <div class="pw" id="pw">
    <div class="pullind" id="pullind">
      <svg class="pullring" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="var(--border2)" stroke-width="2"/>
        <circle id="pullarc" cx="12" cy="12" r="9" fill="none" stroke="var(--neutral-fill)"
          stroke-width="2" stroke-linecap="round" stroke-dasharray="0 56.5" transform="rotate(-90 12 12)"/>
      </svg>
    </div>
    <div class="pages" id="pages">
      <!-- Tab 0: Home -->
      <div class="page" id="p0">
        <div class="pi" id="hc">
          <div class="sc">
            <div class="pr"><div class="pdot"></div></div>
            <div class="stext">Loading...</div>
          </div>
        </div>
      </div>
      
      <!-- Tab 1: Plan -->
      <div class="page" id="p1">
        <div class="pi" id="pc">
          <div class="sc">
            <div class="pr"><div class="pdot"></div></div>
            <div class="stext">Loading budget...</div>
          </div>
        </div>
      </div>
      
      <!-- Tab 2: Spending -->
      <div class="page" id="p2">
        <div class="pi" id="sc2">
          <div class="sc">
            <div class="pr"><div class="pdot"></div></div>
            <div class="stext">Loading...</div>
          </div>
        </div>
      </div>
      
      <!-- Tab 3: Accounts -->
      <div class="page" id="p3">
        <div class="pi" id="ac">
          <div class="sc">
            <div class="pr"><div class="pdot"></div></div>
            <div class="stext">Loading...</div>
          </div>
        </div>
      </div>
      
      <!-- Tab 4: More -->
      <div class="page" id="p4">
        <div class="pi" id="mc">
          <div class="sc">
            <div class="pr"><div class="pdot"></div></div>
            <div class="stext">Loading...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <div class="tabbar">
    <div class="tab active" data-tab="0" onclick="switchTab(0)">
      <div class="ti">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div class="tlabel">Home</div>
    </div>

    <div class="tab" data-tab="1" onclick="switchTab(1)">
      <div class="ti" style="position:relative">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="tbadge" id="planbadge" style="display:none">0</span>
      </div>
      <div class="tlabel">Plan</div>
    </div>

    <div class="tab" data-tab="2" onclick="switchTab(2)">
      <div class="ti">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      </div>
      <div class="tlabel">Spending</div>
    </div>

    <div class="tab" data-tab="3" onclick="switchTab(3)">
      <div class="ti">
        <svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      </div>
      <div class="tlabel">Accounts</div>
    </div>

    <div class="tab" data-tab="4" onclick="switchTab(4)">
      <div class="ti">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
      </div>
      <div class="tlabel">Goals</div>
    </div>

    <div class="tab" onclick="window.location.href='https://mmraguin.github.io/logger/'">
      <div class="ti">
        <svg viewBox="0 0 24 24">
          <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </div>
      <div class="tlabel">Log</div>
    </div>
  </div>
</div>

<!-- Debug Panel -->
<div class="dbg hidden" id="dbgpanel">
  <div class="dbghdr">
    <div class="dbgtitle">&#128269; Debug</div>
    <button class="dbgclose" onclick="toggleDbg()">Close</button>
  </div>
  <div class="dbgtabs">
    <div class="dbgtab active" onclick="switchDbgTab(0)" id="dt0">Overview</div>
    <div class="dbgtab" onclick="switchDbgTab(1)" id="dt1">Budget</div>
    <div class="dbgtab" onclick="switchDbgTab(2)" id="dt2">Activity</div>
    <div class="dbgtab" onclick="switchDbgTab(3)" id="dt3">Snapshot</div>
  </div>
  <div class="dbgbody" id="dbgbody">
    <div class="dbgempty">Load data first.</div>
  </div>
</div>

/* ══════════════════════════════════════════════════════════════════════════
   UTILITY FUNCTIONS
   ══════════════════════════════════════════════════════════════════════════ */

function parseDate(v) {
  if (v == null || v === undefined) return null;
  if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
  
  var s = String(v).trim();
  if (!s || s === '-' || s === '--') return null;
  
  // Skip text headers like "MonthStart"
  if (/^[A-Za-z]/.test(s)) return null;
  
  // ISO timestamp with time component — e.g. "2026-01-31T16:00:00.000Z"
  // Apps Script sends dates as UTC timestamps; must convert to LOCAL time
  // so that 2026-01-31T16:00:00Z = Feb 1 in UTC+8 is treated as February.
  if (s.indexOf('T') > -1) {
    var ts = new Date(s);
    if (!isNaN(ts.getTime())) {
      return new Date(ts.getFullYear(), ts.getMonth(), ts.getDate());
    }
    return null;
  }
  
  // MM/DD/YYYY
  var m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[1] - 1, +m[2]);
  
  // YYYY-MM-DD (date only, no time — treat as local)
  var m2 = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m2) return new Date(+m2[1], +m2[2] - 1, +m2[3]);
  
  // Google Sheets serial (e.g. 45321)
  if (/^\d+$/.test(s)) {
    var n = parseInt(s, 10);
    if (n > 40000 && n < 60000) {
      var e = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
      return new Date(e.getUTCFullYear(), e.getUTCMonth(), e.getUTCDate());
    }
  }
  
  var d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function pn(v) {
  if (typeof v === 'number') return v;
  return parseFloat(String(v || '0').replace(/[^0-9.\-]/g, '')) || 0;
}

// Hero numbers are only ever gray (zero) or white (any real amount) —
// direction/health is signaled separately by the small colored chip/dot,
// not by tinting the whole headline figure.
function heroTone(v) {
  return Math.abs(v) < 0.005 ? 'zero' : 'pos';
}

function peso(n) {
  return '\u20b1' + Math.abs(n).toLocaleString('en-PH', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

// Masks a formatted peso string digit-for-digit, like a password field \u2014
// same punctuation/length, numerals swapped for dots.
function maskedPeso(n) {
  return peso(n).replace(/[0-9]/g, '\u2022');
}

function eyeToggle() {
  return '<span class="eyetog" onclick="event.stopPropagation();toggleNumbersHidden()">' +
    getIcon(numbersHidden ? 'eye-off' : 'eye') + '</span>';
}

function sh(n) {
  var a = Math.abs(n);
  if (a >= 1e6) return '\u20b1' + (a / 1e6).toFixed(1) + 'M';
  if (a >= 1e3) return '\u20b1' + (a / 1e3).toFixed(1) + 'k';
  return '\u20b1' + a.toFixed(0);
}

function fd(d) {
  if (!d) return '--';
  return d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
}

function fmtTimestamp() {
  if (!lastUp) return '';
  return 'Updated ' + lastUp.toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' });
}

function hesc(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function esc(s) {
  return String(s || '').replace(/'/g, "\\'");
}

function haptic() {
  try {
    if (navigator.vibrate) navigator.vibrate(22);
  } catch (e) {}
}

// Header detection — returns true if first row is a header (not a date)
function bHdr(rows) {
  if (!rows || !rows.length) return false;
  return !parseDate(String(rows[0][5] || ''));
}

function aHdr(rows) {
  if (!rows || !rows.length) return false;
  return !parseDate(String(rows[0][10] || ''));
}

function sHdr(rows) {
  if (!rows || !rows.length) return false;
  return !parseDate(String(rows[0][0] || ''));
}


/* ══════════════════════════════════════════════════════════════════════════
   TOUCH HANDLERS
   ══════════════════════════════════════════════════════════════════════════ */

var tx0 = 0, ty0 = 0, pullY = 0, pulling = false, refreshing = false;
var pw = document.getElementById('pw');
var pullIndEl = document.getElementById('pullind');
var pullArcEl = document.getElementById('pullarc');
var PULL_THRESHOLD = 72;
var PULL_CIRC = 56.5; // 2 * PI * r(9), matches #pullarc radius

function resetPull() {
  refreshing = false;
  pulling = false;
  pullIndEl.classList.remove('visible', 'ready', 'spinning');
  pullArcEl.setAttribute('stroke-dasharray', '0 ' + PULL_CIRC);
}

pw.addEventListener('touchstart', function(e) {
  tx0 = e.touches[0].clientX;
  ty0 = e.touches[0].clientY;
  pullY = e.touches[0].clientY;
}, { passive: true });

pw.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - tx0;
  var dy = e.changedTouches[0].clientY - ty0;

  if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 48) {
    if (dx < 0 && curTab < NUM_PAGES - 1) switchTab(curTab + 1);
    if (dx > 0 && curTab > 0) switchTab(curTab - 1);
  }

  if (pulling && !refreshing) {
    refreshing = true;
    pullIndEl.classList.remove('ready');
    pullIndEl.classList.add('visible', 'spinning');
    loadData();
  } else if (!refreshing) {
    pullIndEl.classList.remove('visible', 'ready');
  }
  pulling = false;
}, { passive: true });

pw.addEventListener('touchmove', function(e) {
  if (refreshing) return;
  var page = document.getElementById('p' + curTab);
  if (!page || page.scrollTop !== 0) return;

  var dy = e.touches[0].clientY - pullY;
  if (dy <= 0) return;

  var pct = Math.min(dy / PULL_THRESHOLD, 1);
  pulling = dy > PULL_THRESHOLD;
  pullIndEl.classList.add('visible');
  pullIndEl.classList.toggle('ready', pulling);
  pullArcEl.setAttribute('stroke-dasharray', (PULL_CIRC * pct) + ' ' + PULL_CIRC);
}, { passive: true });

/* ══════════════════════════════════════════════════════════════════════════
   DATA LOADING
   ══════════════════════════════════════════════════════════════════════════ */

function loadData() {
  var btn = document.getElementById('refbtn');
  btn.style.opacity = '0.35';
  btn.style.pointerEvents = 'none';
  
  fetch(WEBHOOK + (WEBHOOK.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(j) {
      if (j.status === 'error') throw new Error(j.message);
      if (!j.budget || !j.activity || !j.snapshot) {
        throw new Error('Missing tabs in response');
      }
      
      rawB = j.budget;
      rawA = j.activity;
      rawS = j.snapshot;
      rawAS = j.accountSnapshot || null;
      lastUp = new Date();
      
      parsed = parseAll();
      renderCur();
      if (dbgOpen) renderDbg();
      
      try {
        localStorage.setItem('tab_v1', JSON.stringify({
          b: rawB,
          a: rawA,
          s: rawS,
          as: rawAS,
          ts: lastUp.toISOString()
        }));
      } catch (e) {}
    })
    .catch(function(e) {
      showErr(e.message);
    })
    .finally(function() {
      btn.style.opacity = '';
      btn.style.pointerEvents = '';
      resetPull();
    });
}

function loadCache() {
  try {
    var c = JSON.parse(localStorage.getItem('tab_v1') || 'null');
    if (!c) return false;
    
    rawB = c.b;
    rawA = c.a;
    rawS = c.s;
    rawAS = c.as || null;
    lastUp = new Date(c.ts);
    
    parsed = parseAll();
    renderCur();
    return true;
  } catch (e) {
    return false;
  }
}

function showErr(msg) {
  var h = '<div class="sc"><div class="etitle">Load failed</div>' +
    '<div class="stext">' + hesc(msg) + '</div>' +
    '<button class="btn-retry" onclick="loadData()">Retry</button></div>';

  ['hc', 'pc', 'sc2', 'ac', 'mc'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = h;
  });
}


/* ══════════════════════════════════════════════════════════════════════════
   DATA PARSING
   ══════════════════════════════════════════════════════════════════════════ */

function parseAll() {
  var vm = viewMonth.getMonth();
  var vy = viewMonth.getFullYear();
  
  var bData = bHdr(rawB) ? rawB.slice(1) : rawB;
  var aData = aHdr(rawA) ? rawA.slice(1) : rawA;
  var sData = sHdr(rawS) ? rawS.slice(1) : rawS;
  
  // Budget rows for this month — filter by col 5 (MonthStart date)
  var bNoDate = 0, bMonthMismatch = 0;
  var bRows = bData.filter(function(row) {
    var d = parseDate(row[5]);
    if (!d) { bNoDate++; return false; }
    if (d.getMonth() !== vm || d.getFullYear() !== vy) { bMonthMismatch++; return false; }
    return true;
  });

  var catMap = {};
  var bDrops = { noCat: 0, noGrp: 0, noCatId: 0, ok: 0 };
  var bDroppedRows = [];
  bRows.forEach(function(row, i) {
    var grp = String(row[6] || '').trim();
    var cat = String(row[7] || '').trim();
    var catId = String(row[3] || '').trim();
    var grpId = String(row[2] || '').trim();
    if (!cat)   { bDrops.noCat++;   bDroppedRows.push([row, 'no Category (col H)']);   return; }
    if (!grp)   { bDrops.noGrp++;   bDroppedRows.push([row, 'no Group (col G)']);       return; }
    if (!catId) {
      bDrops.noCatId++;
      bDroppedRows.push([row, 'no CategoryID (col D)']);
      console.warn('[tab] budget row #' + i + ' dropped — missing CategoryID (col D). month=' + viewMonth.toISOString().slice(0,7) + ' cat="' + cat + '" grp="' + grp + '" rawRow=', row);
      return;
    }
    bDrops.ok++;

    catMap[catId] = {
      name:          cat,
      group:         grp,
      grpId:         grpId,
      grpSort:       pn(row[4]),
      yearlyGoal:    pn(row[8]),   // YearlyGoal — col I
      goal:          pn(row[9]),   // MonthlyGoal — col J
      assigned:      pn(row[11]),  // ManualAssigned — col L (no rollovers)
      totalAssigned: pn(row[12]),  // AssignedThisMonth — col M (includes rollovers)
      activity:      pn(row[13]),  // Activity — col N (negative = spent)
      rollover:      pn(row[14]),  // RolloverPrevMonth — col O
      available:     pn(row[15]),  // AvailableThisMonth — col P (hero)
      overspent:     pn(row[16])   // NeededThisMonth — col Q
    };
  });
  
  // Snapshot for this month
  var rta = 0, atm = 0, inflowExt = 0, outflowExt = 0, cashEnd = 0;
  var prevCashEnd = 0;
  var sMonths = sData.map(function(sr) {
    return { d: parseDate(sr[0]), row: sr };
  }).filter(function(x) { return x.d; }).sort(function(a, b) { return b.d - a.d; });
  
  for (var i = 0; i < sMonths.length; i++) {
    var sm = sMonths[i];
    if (sm.d.getMonth() === vm && sm.d.getFullYear() === vy) {
      var sr = sm.row;
      inflowExt  = pn(sr[2]);  // ExternalInflow — col C
      outflowExt = pn(sr[5]);  // TrueExpense — col F
      cashEnd    = pn(sr[6]);  // CashEnd — col G
      atm        = pn(sr[8]);  // AssignedThisMonth — col I
      rta        = pn(sr[9]);  // AvailableToAssign (hero) — col J
      // Find previous month
      if (sMonths[i + 1]) prevCashEnd = pn(sMonths[i + 1].row[6]);
      break;
    }
  }
  
  // Activity — filter by col 7 (BillingCycle), display date from col 6 (TransactionDate)
  var monthAct = aData.filter(function(row) {
    var d = parseDate(row[7]);
    return d && d.getMonth() === vm && d.getFullYear() === vy;
  });

  var balRows = aData.filter(function(row) {
    return String(row[8]).trim() === 'Balance';
  });

  var expRows = monthAct.filter(function(r) {
    return String(r[8]).trim() === 'Expense';
  });

  var incRows = monthAct.filter(function(r) {
    return String(r[8]).trim() === 'Income';
  });

  var reimbRows = monthAct.filter(function(r) {
    return String(r[8]).trim() === 'Reimbursement';
  });

  var totalInc = incRows.reduce(function(s, r) {
    return s + Math.abs(pn(r[9]));
  }, 0);

  var totalExp = expRows.reduce(function(s, r) {
    return s + Math.abs(pn(r[9]));
  }, 0);

  var totalReimb = reimbRows.reduce(function(s, r) {
    return s + Math.abs(pn(r[9]));
  }, 0);

  // Net spend = expenses minus reimbursements (money that came back)
  var netExp = Math.max(totalExp - totalReimb, 0);
  
  // Transactions per category — expenses AND reimbursements — keyed by CategoryID
  var txnsByCat = {};
  expRows.forEach(function(row) {
    var catId = String(row[4] || '').trim();  // CategoryID — col E
    if (!catId) return;
    if (!txnsByCat[catId]) txnsByCat[catId] = [];
    txnsByCat[catId].push({
      date: parseDate(row[6]),
      type: 'expense',
      amount: pn(row[9]),
      merchant: String(row[10] || '').trim(),
      payment: String(row[11] || '').trim(),
      cat: String(row[12] || '').trim(),
      group: String(row[13] || '').trim(),
      memo: String(row[14] || '').trim()
    });
  });

  // Reimbursements appear in the category they offset
  reimbRows.forEach(function(row) {
    var catId = String(row[4] || '').trim();  // CategoryID — col E
    if (!catId) return;
    if (!txnsByCat[catId]) txnsByCat[catId] = [];
    txnsByCat[catId].push({
      date: parseDate(row[6]),
      type: 'reimbursement',
      amount: Math.abs(pn(row[9])),  // store as positive — it's money back
      merchant: String(row[10] || '').trim(),
      payment: String(row[11] || '').trim(),
      cat: String(row[12] || '').trim(),
      group: String(row[13] || '').trim(),
      memo: String(row[14] || '').trim()
    });
  });
  
  // Build categories
  var categories = [];
  Object.keys(catMap).forEach(function(catId) {
    var d = catMap[catId];
    var actAmt = Math.abs(d.activity);
    var ta = d.totalAssigned;
    var pct = ta > 0 ? Math.min((actAmt / ta) * 100, 100) : (actAmt > 0 ? 100 : 0);
    var status = d.available < 0 ? 'over' :
                 pct >= 80 ? 'warn' :
                 (d.available === 0 && ta === 0) ? 'zero' : 'ok';

    var txns = (txnsByCat[catId] || []).sort(function(a, b) {
      return b.date - a.date;
    });

    categories.push({
      catId: catId,
      cat: d.name,
      grpId: d.grpId,
      group: d.group,
      grpSort: d.grpSort,
      yearlyGoal: d.yearlyGoal,
      goal: d.goal,
      assigned: d.assigned,
      totalAssigned: ta,
      activity: d.activity,
      actAmt: actAmt,
      rollover: d.rollover,
      available: d.available,
      overspent: d.overspent,
      pct: pct,
      status: status,
      txns: txns
    });
  });
  
  // Account balances from AccountSnapshot (current month) — preferred source
  // Falls back to Balance rows from Activity if accountSnapshot not available
  var accountSnap = {};
  // Note: cashEnd already set from MonthSnapshot above — do not re-declare here
  
  if (rawAS && rawAS.length) {
    var asData = rawAS;
    // Skip header row if present (first cell is not a date)
    if (!parseDate(String(rawAS[0][0] || ''))) asData = rawAS.slice(1);
    
    asData.forEach(function(row) {
      var d = parseDate(row[0]);
      if (d && d.getMonth() === vm && d.getFullYear() === vy) {
        var acc = String(row[1] || '').trim();
        if (acc) {
          accountSnap[acc] = {
            cashStart: pn(row[2]),
            activity: pn(row[3]),
            cashEnd: pn(row[4])
          };
        }
      }
    });
  }
  
  // Net worth total — AccountSnapshot col I (date), col J (total) — one row per month
  var netWorthAS = null, prevNetWorthAS = null;
  var prevVm = vm === 0 ? 11 : vm - 1;
  var prevVy = vm === 0 ? vy - 1 : vy;
  if (rawAS && rawAS.length) {
    var asData2 = rawAS;
    if (!parseDate(String(rawAS[0][0] || ''))) asData2 = rawAS.slice(1);
    asData2.forEach(function(row) {
      var dTot = parseDate(row[8]);
      if (!dTot) return;
      if (dTot.getMonth() === vm && dTot.getFullYear() === vy) {
        netWorthAS = pn(row[9]);
      } else if (dTot.getMonth() === prevVm && dTot.getFullYear() === prevVy) {
        prevNetWorthAS = pn(row[9]);
      }
    });
  }

  // Account balances from ALL-TIME Balance rows (fallback / used for txn account detail)
  var accBals = {};
  ACCOUNTS.forEach(function(acc) {
    if (accountSnap[acc]) {
      // Use AccountSnapshot CashEnd if available
      accBals[acc] = accountSnap[acc].cashEnd;
    } else {
      // Fallback: latest Balance row from Activity
      var rows = balRows
        .filter(function(r) { return String(r[11] || '').trim() === acc; })
        .sort(function(a, b) {
          var da = parseDate(a[6]) || new Date(0);
          var db = parseDate(b[6]) || new Date(0);
          return db - da;
        });
      accBals[acc] = rows.length ? pn(rows[0][9]) : 0;
    }
  });
  
  
  // Transactions by account this month
  var txnsByAcc = {};
  ACCOUNTS.forEach(function(acc) {
    txnsByAcc[acc] = monthAct
      .filter(function(r) {
        return String(r[11] || '').trim() === acc &&
               String(r[8]).trim() !== 'Balance';
      })
      .map(function(r) {
        var t = String(r[8]).trim().toLowerCase();
        var amt = pn(r[9]);
        if (t === 'reimbursement') amt = Math.abs(amt);
        return {
          date: parseDate(r[6]),
          type: t,
          amount: amt,
          merchant: String(r[10] || '').trim(),
          payment: acc,
          cat: String(r[12] || '').trim(),
          group: String(r[13] || '').trim(),
          memo: String(r[14] || '').trim()
        };
      })
      .sort(function(a, b) { return b.date - a.date; });
  });
  
  // All month transactions (Spending tab)
  var allTxns = monthAct
    .filter(function(r) { return String(r[8]).trim() !== 'Balance'; })
    .map(function(r) {
      var t = String(r[8]).trim().toLowerCase();
      var amt = pn(r[9]);
      // Reimbursements are money coming back — normalize to positive
      if (t === 'reimbursement') amt = Math.abs(amt);
      return {
        date: parseDate(r[6]),
        type: t,
        amount: amt,
        merchant: String(r[10] || '').trim(),
        payment: String(r[11] || '').trim(),
        cat: String(r[12] || '').trim(),
        group: String(r[13] || '').trim(),
        memo: String(r[14] || '').trim()
      };
    })
    .sort(function(a, b) { return b.date - a.date; });
  
  var overspent = categories.filter(function(c) {
    return c.available < 0;
  });
  
  var totalAssignedAll = bRows.reduce(function(s, row) {
    return s + pn(row[12]);  // AssignedThisMonth — col M
  }, 0);
  
  // Top 5 transactions
  var top5 = expRows.slice()
    .sort(function(a, b) {
      return Math.abs(pn(a[2])) - Math.abs(pn(b[2]));
    })
    .slice(-5)
    .reverse()
    .map(function(r) {
      return {
        merchant: String(r[3] || '').trim(),
        cat: String(r[5] || '').trim(),
        memo: String(r[7] || '').trim(),
        amount: Math.abs(pn(r[2]))
      };
    });
  
  // Top merchants
  var mMap = {};
  expRows.forEach(function(r) {
    var mn = String(r[3] || '').trim() || '--';
    if (!mMap[mn]) mMap[mn] = { total: 0, count: 0 };
    mMap[mn].total += Math.abs(pn(r[2]));
    mMap[mn].count++;
  });
  
  var merch = Object.keys(mMap)
    .sort(function(a, b) { return mMap[b].total - mMap[a].total; })
    .slice(0, 10)
    .map(function(n) {
      return {
        name: n,
        total: mMap[n].total,
        count: mMap[n].count
      };
    });
  
  return {
    categories: categories,
    overspent: overspent,
    readyToAssign: rta,
    assignedThisMonth: atm,
    inflowExt: inflowExt,
    outflowExt: outflowExt,
    totalInc: totalInc,
    totalExp: totalExp,
    totalReimb: totalReimb,
    netExp: netExp,
    totalAssignedAll: totalAssignedAll,
    accBals: accBals,
    accountSnap: accountSnap,
    cashEnd: cashEnd,
    prevCashEnd: prevNetWorthAS !== null ? prevNetWorthAS : prevCashEnd,
    netWorth: netWorthAS !== null ? netWorthAS : (cashEnd || Object.values(accBals).reduce(function(s, v) { return s + v; }, 0)),
    txnsByAcc: txnsByAcc,
    allTxns: allTxns,
    top5: top5,
    merch: merch,
    _bData: bData,
    _aData: aData,
    _sData: sData,
    _bRows: bRows,
    _mAct: monthAct,
    _dbg: {
      bHdr: bHdr(rawB),
      aHdr: aHdr(rawA),
      sHdr: sHdr(rawS),
      rawB: rawB.length,
      rawA: rawA.length,
      rawS: rawS.length,
      bTotal: bData.length,
      bNoDate: bNoDate,
      bMonthMismatch: bMonthMismatch,
      bMo: bRows.length,
      bDropNoCat: bDrops.noCat,
      bDropNoGrp: bDrops.noGrp,
      bDropNoCatId: bDrops.noCatId,
      bDropOk: bDrops.ok,
      bDroppedRows: bDroppedRows,
      aMo: monthAct.length,
      cats: categories.length,
      expCt: expRows.length,
      incCt: incRows.length,
      reimbCt: reimbRows.length,
      balCt: balRows.length,
      hasAccSnap: Object.keys(accountSnap).length > 0
    }
  };
}


/* ══════════════════════════════════════════════════════════════════════════
   RENDER: HOME TAB
   ══════════════════════════════════════════════════════════════════════════ */

function renderHome() {
  var p = parsed;
  var el = document.getElementById('hc');
  var now = new Date();
  var dim = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0).getDate();
  var dom = (viewMonth.getMonth() === now.getMonth() && 
             viewMonth.getFullYear() === now.getFullYear()) ? now.getDate() : dim;
  
  var moPct = Math.round((dom / dim) * 100);
  var budPct = p.totalAssignedAll > 0 ? 
    Math.round((p.netExp / p.totalAssignedAll) * 100) : 0;
  
  var pace = budPct > moPct + 10 ? 'over' : 
             budPct > moPct - 5 ? 'warn' : 'good';
  var pLbl = pace === 'over' ? 'Over pace' : 
             pace === 'warn' ? 'On watch' : 'On track';
  
  var rta = p.readyToAssign;
  var rtaOverAssigned = rta < -1;
  var hs = rtaOverAssigned ? 'neg' :
           rta < p.totalInc * 0.1 ? 'warn' : 'pos';

  var html = '';

  // Health sentence
  var monthName = MONTHS[viewMonth.getMonth()];
  var healthMsg, healthClass;
  if (rtaOverAssigned) {
    healthMsg = monthName + ' is over-assigned.';
    healthClass = 'neg';
  } else if (pace === 'over') {
    healthMsg = monthName + ' needs a reset.';
    healthClass = 'warn';
  } else if (p.overspent.length > 0) {
    healthMsg = monthName + ' has some overspending.';
    healthClass = 'warn';
  } else if (p.readyToAssign < p.totalInc * 0.05) {
    healthMsg = monthName + ' is fully allocated.';
    healthClass = 'pos';
  } else {
    healthMsg = monthName + ' looks great.';
    healthClass = 'pos';
  }
  
  // Greeting
  html += '<div>' +
    '<div class="home-hey">Hey, Miles.</div>' +
    '<div class="home-sub"><span style="color:var(' + 
    (healthClass === 'pos' ? '--income' : healthClass === 'warn' ? '--warn' : '--expense') + 
    ')">' + healthMsg + '</span></div>' +
    '</div>';
  
  // Overspent alerts
  p.overspent.forEach(function(c) {
    if (dismissed[c.catId]) return;
    html += '<div class="alert e" data-catid="' + hesc(c.catId) + '" style="gap:10px">' +
      '<span style="font-size:16px;flex-shrink:0">⚠</span>' +
      '<div class="atxt" style="flex:1">' +
      '<strong style="color:var(--expense);display:block">' + hesc(c.cat) + ' is overspent</strong>' +
      '<span style="font-size:12px">&#8369;0 left &mdash; over by ' + peso(Math.abs(c.available)) + ' this period</span>' +
      '</div>' +
      '<button class="ax" onclick="dismiss(\'' + esc(c.catId) + '\')">&#215;</button></div>';
  });
  
  // Left to Assign hero
  html += '<div class="hero"><div class="hglow ' + hs + '"></div>' +
    '<div class="hi" style="position:relative;z-index:1">' +
    '<div class="hmlbl">Left to Assign' + eyeToggle() + '</div>' +
    '<div class="hamt ' + heroTone(rta) + '" style="margin:4px 0">' +
    (numbersHidden ? maskedPeso(Math.abs(rta)) :
      (rtaOverAssigned ? '&#8722;' : '') + peso(Math.abs(rta))) + '</div>' +
    '<div class="hero-from">From ' + peso(p.totalInc) + ' income this period</div>' +
    '</div>' +
    '<div class="hstats">' +
    '<div class="hs"><div class="hslbl">Income</div><div class="hsval">' + sh(p.totalInc) + '</div></div>' +
    '<div class="hs"><div class="hslbl">Assigned</div><div class="hsval">' + sh(p.totalAssignedAll) + '</div></div>' +
    '<div class="hs"><div class="hslbl">Spent</div><div class="hsval">' + sh(p.netExp) + '</div></div>' +
    '</div></div>';

  // Spending Pace
  html += '<div class="pace"><div class="pace-hdr">' +
    '<div class="pace-lbl">Spending Pace &mdash; ' +
    MONTHS[viewMonth.getMonth()].slice(0, 3).toUpperCase() + '</div>' +
    '<div class="pchip ' + pace + '">' + pLbl + '</div></div>' +
    '<div class="prow"><span class="prl">Month progress</span>' +
    '<span class="prv">Day ' + dom + ' of ' + dim + ' &nbsp;' + moPct + '%</span></div>' +
    '<div class="bt"><div class="bf" style="width:' + moPct + '%"></div></div>' +
    '<div class="prow"><span class="prl">Budget used</span>' +
    '<span class="prv"><span style="font-weight:700;color:' +
    (pace === 'over' ? 'var(--expense)' : pace === 'warn' ? 'var(--warn)' : 'var(--income)') + '">' +
    budPct + '%</span> of ' + sh(p.totalAssignedAll) + '</span></div>' +
    '<div class="bt last"><div class="bf" style="width:' + Math.min(budPct, 100) + '%"></div></div>' +
    '</div>';
  
  // Goals
  var goals = p.categories.filter(function(c) {
    return c.group === 'Goals' || c.group === 'Emergency';
  });
  
  if (goals.length) {
    html += '<div class="home-sechdr">' +
      '<span class="home-seclbl">Goals</span>' +
      '<span class="seeall" onclick="switchTab(4)">Manage</span></div>';
    html += '<div class="goals-scroll">';
    
    goals.forEach(function(g) {
      var target = g.yearlyGoal > 0 ? g.yearlyGoal : (g.goal > 0 ? g.goal * 12 : 0);
      var funded = Math.max(g.available, 0);
      var gpct = target > 0 ? Math.min(Math.round((funded / target) * 100), 100) : 0;
      var remaining = target > 0 ? Math.max(target - funded, 0) : 0;
      var gclr = gpct >= 100 ? 'var(--income)' : gpct >= 60 ? 'var(--neutral-fill)' : 'var(--warn)';
      
      var r = 22;
      var circ = 2 * Math.PI * r;
      var fill = circ * (gpct / 100);
      var gap = circ - fill;
      
      html += '<div class="gcard">' +
        '<div class="gcard-pct">' +
        '<svg class="gcard-svg" viewBox="0 0 56 56">' +
        '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="var(--surface3)" stroke-width="4"/>' +
        '<circle cx="28" cy="28" r="' + r + '" fill="none" stroke="' + gclr + '" stroke-width="4"' +
        ' stroke-dasharray="' + fill.toFixed(1) + ' ' + gap.toFixed(1) + '" stroke-linecap="round"/>' +
        '</svg>' +
        '<div class="gcard-num" style="color:' + gclr + '">' + gpct + '%</div>' +
        '</div>' +
        '<div class="gcard-name">' + hesc(g.cat) + '</div>' +
        '<div class="gcard-sub">To go</div>' +
        '<div class="gcard-val" style="color:' + gclr + '">' + peso(remaining) + '</div>' +
        '</div>';
    });
    
    html += '</div>';
  }
  
  // Budget preview — group rollups, not individual categories
  var homeGroups = GORDER.filter(function(g) {
    return g !== 'Income' && g !== 'Balance' && g !== 'Goals' &&
           g !== 'Emergency' && g !== 'Sinking';
  }).map(function(g) {
    var cats = p.categories.filter(function(c) { return c.group === g; });
    return {
      group: g,
      totalAssigned: cats.reduce(function(s, c) { return s + c.totalAssigned; }, 0),
      available: cats.reduce(function(s, c) { return s + c.available; }, 0),
      actAmt: cats.reduce(function(s, c) { return s + c.actAmt; }, 0),
      over: cats.some(function(c) { return c.status === 'over'; }),
      warn: cats.some(function(c) { return c.status === 'warn'; })
    };
  }).filter(function(g) { return g.totalAssigned > 0; });

  if (homeGroups.length) {
    html += '<div class="home-sechdr">' +
      '<span class="home-seclbl">Budget</span>' +
      '<span class="seeall" onclick="switchTab(1)">See all</span></div>';
    html += '<div class="tlist">';

    homeGroups.forEach(function(g) {
      var spentPct = g.totalAssigned > 0 ?
        Math.min(Math.round((g.actAmt / g.totalAssigned) * 100), 100) :
        (g.actAmt > 0 ? 100 : 0);
      var amtCls = g.over ? 'neg' : g.warn ? 'warn' : 'pos';

      html += '<div class="hbudrow" onclick="switchTab(1)">' +
        '<div class="hbudl">' +
        '<div class="hbudname">' + hesc(g.group) + '</div>' +
        '<div class="hbudbar"><div class="hbudfill" style="width:' + spentPct + '%"></div></div>' +
        '</div>' +
        '<div class="hbudr">' +
        '<div class="hbudamt ' + amtCls + '">' +
        (g.available < 0 ? '&#8722;' : '') + peso(Math.abs(g.available)) + '</div>' +
        '<div class="hbudsub">of ' + sh(g.totalAssigned) + '</div>' +
        '</div>' +
        '</div>';
    });

    html += '</div>';
  }
  
  // Recent transactions
  var recent = p.allTxns.slice(0, 5);
  if (recent.length) {
    html += '<div class="home-sechdr">' +
      '<span class="home-seclbl">Recent</span>' +
      '<span class="seeall" onclick="switchTab(2)">All txns</span></div>';
    html += '<div class="tlist">';
    
    recent.forEach(function(t) {
      var cls = t.type === 'income' || t.type === 'reimbursement' ? 'income' :
                t.type === 'transfer' || t.type === 'reconciliation' ? 'neutral' : 'expense';

      html += '<div class="trow" onclick="switchTab(2)">' +
        '<div class="caticon">' + getIcon(iconFor(t.cat, t.group)) + '</div>' +
        '<div class="trowl">' +
        '<div class="trowname">' + hesc(t.merchant || '--') + '</div>' +
        (t.memo ? '<div class="trowmemo">' + hesc(t.memo) + '</div>' : '') +
        '<div class="trowcat">' + hesc(t.cat || t.group || t.type) + ' &middot; ' +
        hesc(t.payment) + ' &middot; ' + fd(t.date) + '</div>' +
        '</div>' +
        '<div class="trowr">' +
        '<div class="trowamt ' + cls + '">' +
        (t.amount < 0 ? '&#8722;' : '+') + peso(Math.abs(t.amount)) + '</div>' +
        '</div>' +
        '</div>';
    });
    
    html += '</div>';
  }
  
  html += '<div class="ts">' + fmtTimestamp() + '</div>';
  
  el.innerHTML = html;
}


/* ══════════════════════════════════════════════════════════════════════════
   RENDER: PLAN TAB
   ══════════════════════════════════════════════════════════════════════════ */

function renderPlan() {
  var p = parsed;
  var el = document.getElementById('pc');
  var lta = p.readyToAssign;
  var ltaOver = lta < -1;
  var hs = ltaOver ? 'neg' : lta < p.totalInc * 0.15 ? 'warn' : 'pos';
  
  var badge = document.getElementById('planbadge');
  badge.style.display = p.overspent.length ? '' : 'none';
  badge.textContent = p.overspent.length;
  
  var byGrp = {};
  p.categories.forEach(function(item) {
    var g = item.group || 'Other';
    if (!byGrp[g]) byGrp[g] = [];
    byGrp[g].push(item);
  });
  
  Object.keys(byGrp).forEach(function(g) {
    byGrp[g].sort(function(a, b) {
      if (a.status === 'over' && b.status !== 'over') return -1;
      if (b.status === 'over' && a.status !== 'over') return 1;
      return a.available - b.available;
    });
  });
  
  var oGrps = GORDER.filter(function(g) {
    return byGrp[g];
  }).concat(Object.keys(byGrp).filter(function(g) {
    return GORDER.indexOf(g) < 0;
  }));
  
  var html = '';
  
  // Overspent alerts
  p.overspent.forEach(function(c) {
    if (dismissed[c.catId]) return;
    html += '<div class="alert e" data-catid="' + hesc(c.catId) + '"><div class="atxt">' +
      '<strong>' + hesc(c.cat) + ' overspent</strong>' +
      '<span>' + peso(Math.abs(c.available)) + ' over</span></div>' +
      '<button class="ax" onclick="dismiss(\'' + esc(c.catId) + '\')">&#215;</button></div>';
  });
  
  // Left to Assign hero
  html += '<div class="hero"><div class="hglow ' + hs + '"></div><div class="hi">' +
    '<div class="hmlbl">Left to Assign' + eyeToggle() + '</div>' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
    '<div class="hamt ' + heroTone(lta) + '">' +
    (numbersHidden ? maskedPeso(Math.abs(lta)) :
      (ltaOver ? '&#8722;' : '') + peso(Math.abs(lta))) + '</div>' +
    '<div class="hchip ' + hs + '">' +
    (ltaOver ? 'Over-assigned' : lta < p.totalInc * 0.15 ? 'Low' : 'On track') +
    '</div>' +
    '</div></div><div class="hstats" style="margin-top:12px">' +
    '<div class="hs"><div class="hslbl">Income</div><div class="hsval">' + sh(p.totalInc) + '</div></div>' +
    '<div class="hs"><div class="hslbl">Spent</div><div class="hsval">' + sh(p.netExp) + '</div></div>' +
    '<div class="hs"><div class="hslbl">Assigned</div><div class="hsval">' + sh(p.totalAssignedAll) + '</div></div>' +
    '</div></div>';
  
  // Summary bar
  var sumPct = p.totalAssignedAll > 0 ? 
    Math.min(Math.round((p.netExp / p.totalAssignedAll) * 100), 999) : 0;
  var sumClr = sumPct > 100 ? 'var(--expense)' :
               sumPct > 80 ? 'var(--warn)' : 'var(--neutral-fill)';
  
  html += '<div class="sumbar"><div class="sumbar-row">' +
    '<span class="sumbar-lbl">Total Assigned vs Activity</span>' +
    '<span class="sumbar-val">' + peso(p.totalAssignedAll) + '</span></div>' +
    '<div class="sumbar-track" style="height:2px;background:var(--surface3);' +
    'border-radius:3px;overflow:hidden;position:relative">' +
    '<div style="position:absolute;top:0;left:0;height:100%;width:100%;' +
    'background:rgba(42,157,159,.18);border-radius:3px"></div>' +
    '<div style="position:absolute;top:0;left:0;height:100%;width:' + 
    Math.min(sumPct, 100) + '%;border-radius:3px;background:' + sumClr + 
    ';transition:width .6s"></div>' +
    '</div><div class="sumbar-sub">' +
    '<span class="sumbar-sublbl">Activity ' + sumPct + '%</span>' +
    '<span class="sumbar-subval">&#8722;' + peso(p.netExp) + '</span>' +
    '</div></div>';
  
  // Search
  html += '<div class="sw"><span class="sico">&#9906;</span>' +
    '<input class="si" id="catq" placeholder="Search categories..." ' +
    'oninput="filterCats(this.value)"></div>';

  oGrps.forEach(function(grp) {
    var items = byGrp[grp];
    if (!items || !items.length) return;
    
    var gAv = items.reduce(function(s, i) { return s + i.available; }, 0);
    var gCls = gAv < 0 ? 'neg' : gAv > 0 ? 'pos' : 'zero';
    var gid = 'g_' + items[0].grpId;
    
    html += '<div class="grp"><div class="grphdr" onclick="togGrp(\'' + gid + '\')">' +
      '<div class="grptitle"><span class="grptog" id="gt_' + gid + '">&#9662;</span>' +
      hesc(grp) + '</div>' +
      '<div class="grpav ' + gCls + '">' + 
      (gAv < 0 ? '&#8722;' : '') + sh(Math.abs(gAv)) + '</div></div>' +
      '<div class="grpcats" id="gc_' + gid + '">';
    
    items.forEach(function(c) {
      var pid = 'dp_' + c.catId;
      var bCls = c.status === 'over' ? 'over' : 
                 c.status === 'warn' ? 'warn' : 'ok';
      
      var actW = c.totalAssigned > 0 ? 
        Math.min(Math.round((c.actAmt / c.totalAssigned) * 100), 100) : 
        (c.actAmt > 0 ? 100 : 0);
      
      html += '<div class="cat ' + c.status + '" ' +
        'onclick="togDet(\'' + pid + '\')">' +
        '<div class="cattop">' +
        '<div class="caticon">' + getIcon(iconFor(c.cat, c.group)) + '</div>' +
        '<div class="catl"><div class="catname">' + hesc(c.cat) + '</div>' +
        '<div class="catsub">' +
        (c.totalAssigned <= 0 ? 'no budget' + (c.txns.length ? ' &middot; ' : '') : '') +
        (c.txns.length ? c.txns.length + ' txn' +
          (c.txns.length !== 1 ? 's' : '') : '') + '</div></div>' +
        '<div class="catr"><div class="catav ' + 
        (c.available < 0 ? 'neg' : c.available === 0 ? 'zero' : 'pos') + '">' +
        (c.available < 0 ? '&#8722;' : '') + peso(Math.abs(c.available)) + '</div>' +
        (c.actAmt > 0 ? '<div class="catsp">&#8722;' + sh(c.actAmt) + ' spent</div>' : '') +
        '</div></div>' +
        
        // Progress bar — full-width track, activity fill
        '<div class="catbarwrap">' +
        '<div class="catbarlbls"><span>' + 
        (c.totalAssigned > 0 ? sh(c.actAmt) + ' / ' + sh(c.totalAssigned) : 'no budget') + 
        '</span><span>' + 
        (c.totalAssigned > 0 ? Math.round(c.pct) + '%' : '') + '</span></div>' +
        '<div class="catbartrack">' +
        '<div class="catbaract ' + bCls + '" style="width:' + actW + '%"></div>' +
        '</div></div>' +
        
        // Detail panel
        '<div class="det" id="' + pid + '"><div class="detin">' +
        '<div class="detgrid">' +
        '<div class="dstat"><div class="dslbl">Assigned</div>' +
        '<div class="dsval n">' + peso(c.assigned) + '</div></div>' +
        '<div class="dstat"><div class="dslbl">Activity</div>' +
        '<div class="dsval ' + (c.actAmt > 0 ? 'neg' : 'n') + '">' + 
        (c.actAmt > 0 ? '&#8722;' : '') + peso(c.actAmt) + '</div></div>' +
        '<div class="dstat"><div class="dslbl">Available</div>' +
        '<div class="dsval ' + (c.available < 0 ? 'neg' : c.available === 0 ? 'n' : 'pos') + '">' +

        ((['Sinking', 'Emergency', 'Goals'].indexOf(c.group) >= 0) ?

          '<div class="dsval n">' + (c.goal > 0 ? peso(c.goal) : '—') + '</div></div>' :
          '<div class="dstat"><div class="dslbl">Rollover</div>' +
          '<div class="dsval ' + (c.rollover > 0 ? 'pos' : 'n') + '">' + peso(c.rollover) + '</div></div>') +
        '</div>' +
        
        // BvA bar
        '<div class="bvabarsec">' +
        '<div class="bvalblrow"><span class="bvalbl">Budgeted vs Activity</span>' +
        '<span class="bvaval ' + (c.available < 0 ? 'ec' : c.available === 0 ? 'nc' : 'ic') + '">' +
        (c.totalAssigned > 0 ? Math.round(c.pct) + '% used' : 'no budget') + '</span></div>' +
        '<div class="bvatrack">' +
        '<div class="bvaact ' + bCls + '" style="width:' + Math.round(c.pct) + '%"></div>' +
        '</div>' +
        '<div class="bvasubrow">' +
        '<span class="bvasubl">Activity ' + peso(c.actAmt) + '</span>' +
        '<span class="bvasubl">Budgeted ' + peso(c.totalAssigned) + '</span></div>' +
        '</div>' +
        
        // Transactions
        (c.txns.length ?
          '<div class="dettitle">Transactions &middot; ' + c.txns.length + '</div>' +
          c.txns.map(function(t, i) {
            var isReimb = t.type === 'reimbursement';
            return '<div class="dtxn"><div class="txn-idx">' + (i + 1) + '</div>' +
              '<div class="dtxnl">' +
              '<div class="dtxnname">' + hesc(t.merchant || '--') + '</div>' +
              (t.memo ? '<div class="dtxnmemo">' + hesc(t.memo) + '</div>' : '') +
              '<div class="dtxnmeta">' + fd(t.date) + ' &middot; ' + hesc(t.payment) + (isReimb ? ' &middot; reimbursement' : '') + '</div>' +
              '</div><div class="dtxnamt ' + (isReimb ? 'i' : 'e') + '">' +
              (isReimb ? '+' : '&#8722;') + peso(Math.abs(t.amount)) + 
              '</div></div>';
          }).join('')
          : '<div class="dtxnempty">No transactions this month</div>') +
        '</div></div></div>';
      
    });
    
    html += '</div></div>';
  });
  
  html += '<div class="ts">' + fmtTimestamp() + '</div>';
  
  el.innerHTML = html;
}

function togGrp(id) {
  var cats = document.getElementById('gc_' + id);
  var tog = document.getElementById('gt_' + id);
  if (!cats) return;
  
  var c = cats.classList.toggle('coll');
  cats.style.maxHeight = c ? '' : '9999px';
  if (tog) tog.classList.toggle('coll', c);
}

function togDet(id) {
  var det = document.getElementById(id);
  if (!det) return;
  
  var wasOpen = det.classList.contains('open');
  document.querySelectorAll('.det.open').forEach(function(d) {
    d.classList.remove('open');
  });
  
  if (!wasOpen) det.classList.add('open');
  haptic();
}

function dismiss(catId) {
  dismissed[catId] = true;
  document.querySelectorAll('.alert').forEach(function(el) {
    if (el.dataset.catid === catId) el.remove();
  });
}

function filterCats(q) {
  var low = q.toLowerCase();
  document.querySelectorAll('.cat').forEach(function(el) {
    var n = (el.querySelector('.catname') || {}).textContent || '';
    el.style.display = n.toLowerCase().indexOf(low) >= 0 ? '' : 'none';
  });
  document.querySelectorAll('.grp').forEach(function(el) {
    var any = [].slice.call(el.querySelectorAll('.cat')).some(function(c) {
      return c.style.display !== 'none';
    });
    el.style.display = any ? '' : 'none';
  });
}


/* ══════════════════════════════════════════════════════════════════════════
   RENDER: SPENDING TAB
   ══════════════════════════════════════════════════════════════════════════ */

function renderSpend() {
  var p = parsed;
  var el = document.getElementById('sc2');
  
  var catSet = ['All'];
  p.allTxns.filter(function(t) {
    return (t.type === 'expense' || t.type === 'reimbursement') && t.cat;
  }).forEach(function(t) {
    if (catSet.indexOf(t.cat) < 0) catSet.push(t.cat);
  });
  catSet.sort(function(a, b) {
    return a === 'All' ? -1 : a.localeCompare(b);
  });
  
  var txns = p.allTxns.filter(function(t) {
    return t.type !== 'balance';
  });
  
  if (spendFilter !== 'All') {
    txns = txns.filter(function(t) {
      return t.cat === spendFilter;
    });
  }
  
  // Net spend = expenses minus reimbursements for the current filter
  var grossExp = txns.filter(function(t) {
    return t.type === 'expense';
  }).reduce(function(s, t) {
    return s + Math.abs(t.amount);
  }, 0);
  var filtReimb = txns.filter(function(t) {
    return t.type === 'reimbursement';
  }).reduce(function(s, t) {
    return s + Math.abs(t.amount);
  }, 0);
  var total = Math.max(grossExp - filtReimb, 0);
  
  var html = '<div class="chips">';
  catSet.slice(0, 14).forEach(function(c) {
    html += '<div class="chip' + (c === spendFilter ? ' active' : '') + '" ' +
      'onclick="setSF(\'' + esc(c) + '\')">' + hesc(c) + '</div>';
  });
  html += '</div>';
  
  var heroAmt = (spendFilter === 'All' && p.outflowExt) ? p.outflowExt : total;
  html += '<div class="hero"><div class="hglow neg"></div>' +
    '<div class="hi">' +
    '<div class="hmlbl">' + (spendFilter === 'All' ? 'Total Spent' : hesc(spendFilter)) + eyeToggle() + '</div>' +
    '<div class="hamt ' + heroTone(heroAmt) + '">' + (numbersHidden ? maskedPeso(heroAmt) : peso(heroAmt)) + '</div>' +
    (spendFilter === 'All' && p.totalReimb > 0 ?
      '<div style="font-size:9px;color:var(--muted);margin-top:2px">' + peso(p.totalReimb) + ' reimbursed</div>' : '') +
    '</div></div>';
  
  html += buildTGs(txns);
  
  html += '<div class="ts">' + fmtTimestamp() + '</div>';
  
  el.innerHTML = html;
}

function setSF(cat) {
  spendFilter = cat;
  renderSpend();
  document.getElementById('p2').scrollTop = 0;
}

function buildTGs(txns) {
  if (!txns.length) return '<div class="tempty">No transactions</div>';
  
  var byDate = {};
  var keys = [];
  
  txns.forEach(function(t) {
    var key = t.date ? 
      t.date.toLocaleDateString('en-PH', { 
        month: 'short', day: 'numeric', year: 'numeric' 
      }) : '--';
    if (!byDate[key]) {
      byDate[key] = { txns: [], date: t.date };
      keys.push(key);
    }
    byDate[key].txns.push(t);
  });
  
  return keys.map(function(dk, gi) {
    var g = byDate[dk];
    var dt = g.txns.reduce(function(s, t) {
      return s + t.amount;
    }, 0);
    
    return '<div class="dg"><div class="dghdr"><span class="dglbl">' + dk + '</span>' +
      '<span class="dgtot ' + (dt < 0 ? 'neg' : 'pos') + '">' +
      (dt < 0 ? '&#8722;' : '+') + peso(Math.abs(dt)) + '</span></div>' +
      '<div class="tlist">' +
      g.txns.map(function(t, i) {
        var cls = t.type === 'income' ? 'income' :
                  t.type === 'reimbursement' ? 'income' :
                  t.type === 'transfer' || t.type === 'reconciliation' ? 'neutral' : 'expense';
        // Reimbursements are positive money-back; expenses are negative outflows
        var isPositive = t.type === 'income' || t.type === 'reimbursement' || t.amount >= 0;
        return '<div class="trow" style="animation-delay:' + ((gi * 4 + i) * 12) + 'ms">' +
          '<div class="caticon">' + getIcon(iconFor(t.cat, t.group)) + '</div>' +
          '<div class="trowl"><div class="trowname">' + hesc(t.merchant || '--') + '</div>' +
          (t.memo ? '<div class="trowmemo">' + hesc(t.memo) + '</div>' : '') +
          '<div class="trowcat">' + (t.type === 'reimbursement' ? '↩ ' : '') + hesc(t.cat || t.group || '--') + '</div></div>' +
          '<div class="trowr"><div class="trowamt ' + cls + '">' +
          (isPositive ? '+' : '&#8722;') + peso(Math.abs(t.amount)) + '</div>' +
          '<div class="trowvia">' + hesc(t.payment) + '</div></div></div>';
      }).join('') + '</div></div>';
  }).join('');
}


/* ══════════════════════════════════════════════════════════════════════════
   RENDER: ACCOUNTS TAB
   ══════════════════════════════════════════════════════════════════════════ */

function renderAccounts() {
  var p = parsed;
  var el = document.getElementById('ac');
  
  if (accDet) {
    renderAccDet(accDet);
    return;
  }
  
  var nw = p.netWorth;
  var momAmt = p.prevCashEnd > 0 ? nw - p.prevCashEnd : 0;
  var momPct = p.prevCashEnd > 0 ? (momAmt / Math.abs(p.prevCashEnd)) * 100 : 0;
  var momClr = momAmt >= 0 ? 'var(--income)' : 'var(--expense)';
  
  var html = '<div class="nw"><div class="nwlbl">Net Worth' + eyeToggle() + '</div>' +
    '<div class="nwamt ' + heroTone(nw) + '">' +
    (numbersHidden ? maskedPeso(Math.abs(nw)) :
      (nw < 0 ? '&#8722;' : '') + peso(Math.abs(nw))) + '</div>';
  
  if (momAmt !== 0) {
    html += '<div class="nwsub" style="color:' + momClr + '">' +
      (momAmt >= 0 ? '+' : '&#8722;') + peso(Math.abs(momAmt)) +
      ' (' + (momAmt >= 0 ? '+' : '') + momPct.toFixed(1) + '%) from last month</div>';
  } else {
    html += '<div class="nwsub">Total across all accounts</div>';
  }
  html += '</div>';
  
  html += '<div class="lbl">Accounts</div><div class="accs">';
  
  ACCOUNTS.forEach(function(acc) {
    var snap = p.accountSnap[acc];
    var bal = snap ? snap.cashEnd : (p.accBals[acc] || 0);
    var txns = p.txnsByAcc[acc] || [];
    var bc = bal > 0 ? 'pos' : bal < 0 ? 'neg' : 'zero';
    
    var accIcon = /credit/i.test(acc) ? 'card' : 'bank';

    html += '<div class="accrow" onclick="openAccDet(\'' + acc + '\')">' +
      '<div class="accleft">' +
      '<div class="caticon">' + getIcon(accIcon) + '</div>' +
      '<div class="accl"><div class="accname">' + acc + '</div>';
    
    if (snap) {
      var actClr = snap.activity >= 0 ? 'var(--income)' : 'var(--expense)';
      html += '<div class="accmeta">' +
        '<span style="color:' + actClr + '">' +
        (snap.activity >= 0 ? '+' : '&#8722;') + peso(Math.abs(snap.activity)) +
        '</span> &nbsp;&middot;&nbsp; ' + txns.length + ' txn' + (txns.length !== 1 ? 's' : '') +
        '</div>';
    } else {
      html += '<div class="accmeta">' + txns.length + ' txn' + 
        (txns.length !== 1 ? 's' : '') + ' this month</div>';
    }
    
    html += '</div></div>' +
      '<div class="accr"><div class="accbal ' + bc + '">' +
      (bal < 0 ? '&#8722;' : '') + peso(Math.abs(bal)) + '</div>' +
      '<div class="accchev">&#8250;</div></div></div>';
  });
  
  html += '</div><div class="ts">' + fmtTimestamp() + '</div>';

  el.innerHTML = html;
}

function openAccDet(acc) {
  accDet = { account: acc, filter: 'all' };
  renderAccDet(accDet);
  haptic();
}

function renderAccDet(mode) {
  var p = parsed;
  var el = document.getElementById('ac');
  var acc = mode.account;
  var flt = mode.filter;
  
  var snap = p.accountSnap[acc];
  var bal = snap ? snap.cashEnd : (p.accBals[acc] || 0);
  var all = p.txnsByAcc[acc] || [];
  var txns = flt === 'income' ? 
    all.filter(function(t) { return t.type === 'income' || t.type === 'reimbursement'; }) : 
    flt === 'expense' ? 
    all.filter(function(t) { return t.type === 'expense'; }) : all;
  
  var header = '<div class="back" onclick="closeAccDet()">' +
    '<span style="font-size:16px">&#8249;</span>' + acc + '</div>' +
    '<div class="nw" style="border-radius:14px;padding:14px 16px">' +
    '<div class="nwlbl">Balance' + eyeToggle() + '</div>' +
    '<div class="nwamt ' + heroTone(bal) + '" style="font-size:44px">' +
    (numbersHidden ? maskedPeso(Math.abs(bal)) :
      (bal < 0 ? '&#8722;' : '') + peso(Math.abs(bal))) + '</div>';
  
  if (snap) {
    var actClr = snap.activity >= 0 ? 'var(--income)' : 'var(--expense)';
    header += '<div class="nwsub" style="margin-top:6px;display:flex;gap:14px">' +
      '<span>Started ' + peso(snap.cashStart) + '</span>' +
      '<span style="color:' + actClr + '">' +
      (snap.activity >= 0 ? '+' : '&#8722;') + peso(Math.abs(snap.activity)) + ' activity' +
      '</span></div>';
  }
  header += '</div>';
  
  el.innerHTML = header +
    '<div class="afbar">' +
    '<div class="afc' + (flt === 'all' ? ' active' : '') + '" ' +
    'onclick="setAF(\'' + acc + '\',\'all\')">All</div>' +
    '<div class="afc' + (flt === 'income' ? ' active' : '') + '" ' +
    'onclick="setAF(\'' + acc + '\',\'income\')">Income</div>' +
    '<div class="afc' + (flt === 'expense' ? ' active' : '') + '" ' +
    'onclick="setAF(\'' + acc + '\',\'expense\')">Expenses</div>' +
    '</div>' + buildTGs(txns) +
    '<div class="ts">' + fmtTimestamp() + '</div>';
}

function setAF(acc, flt) {
  accDet = { account: acc, filter: flt };
  renderAccDet(accDet);
}

function closeAccDet() {
  accDet = null;
  renderAccounts();
}


/* ══════════════════════════════════════════════════════════════════════════
   RENDER: MORE TAB
   ══════════════════════════════════════════════════════════════════════════ */

function renderMore() {
  var p = parsed;
  var el = document.getElementById('mc');
  var sinking   = p.categories.filter(function(c) { return c.group === 'Sinking'; });
  var emergency = p.categories.filter(function(c) { return c.group === 'Emergency'; });
  var goals     = p.categories.filter(function(c) { return c.group === 'Goals'; });

  function groupHeader(label, cats) {
    var totalAvail  = cats.reduce(function(s, c) { return s + c.available; }, 0);
    var totalTarget = cats.reduce(function(s, c) {
      return s + (c.yearlyGoal > 0 ? c.yearlyGoal : c.goal * 12);
    }, 0);
    var pct     = totalTarget > 0 ? Math.min((totalAvail / totalTarget) * 100, 100) : 0;
    var pctRnd  = Math.round(Math.max(0, pct));
    var funded  = pct >= 100;
    var textCls = totalAvail < 0 ? 'ec' : funded ? 'ic' : 'nc';
    var barHtml = totalTarget > 0
      ? '<div class="bt last"><div class="bf" style="width:' + pctRnd + '%"></div></div>'
      : '';
    return '<div class="goalghdr">' +
      '<div class="goalgtitle">' + label + '</div>' +
      '<div class="goalgtotal">' +
      '<span class="' + textCls + '">' + peso(totalAvail) + '</span>' +
      (totalTarget > 0 ? '<span class="goalgtarget"> / ' + peso(totalTarget) + '</span>' : '') +
      '</div>' +
      '</div>' + barHtml;
  }

  function goalRow(c, displayName) {
    var target = c.yearlyGoal > 0 ? c.yearlyGoal : c.goal * 12;
    var pct    = target > 0 ? Math.min((c.available / target) * 100, 100) : 0;
    var pctRnd = Math.round(Math.max(0, pct));
    var funded = pct >= 100;
    var moLine = c.goal > 0 ? ' &middot; ' + peso(c.goal) + '/mo' : '';
    var amtCls = c.available < 0 ? 'neg' : funded ? 'pos' : 'n';
    return '<div class="mrow">' +
      '<div class="caticon">' + getIcon(iconFor(c.cat, c.group)) + '</div>' +
      '<div class="mrowbody">' +
      '<div class="mrowtop">' +
      '<span class="mrowname">' + hesc(displayName) + '</span>' +
      '<span class="mamount ' + amtCls + '">' + pctRnd + '%</span>' +
      '</div>' +
      '<div class="gbar">' +
      '<div class="gfill' + (funded ? ' full' : '') + '" style="width:' + pctRnd + '%"></div>' +
      '</div>' +
      '<div class="mrowsub">' + peso(c.available) +
      (target > 0 ? ' of ' + peso(target) : '') +
      moLine + '</div>' +
      '</div>' +
      '</div>';
  }

  var html = '';

  if (sinking.length) {
    html += '<div class="goal-group">' + groupHeader('Sinking Funds', sinking) + '<div class="more">';
    sinking.forEach(function(c) { html += goalRow(c, c.cat); });
    html += '</div></div>';
  }

  if (emergency.length) {
    html += '<div class="goal-group">' + groupHeader('Emergency', emergency) + '<div class="more">';
    emergency.forEach(function(c) {
      var name = c.cat.replace(/\s*fund\s*$/i, '').trim() || c.cat;
      html += goalRow(c, name);
    });
    html += '</div></div>';
  }

  if (goals.length) {
    html += '<div class="goal-group">' + groupHeader('Goals', goals) + '<div class="more">';
    goals.forEach(function(c) { html += goalRow(c, c.cat); });
    html += '</div></div>';
  }

  if (!sinking.length && !emergency.length && !goals.length) {
    html += '<div style="padding:40px 20px;text-align:center;font-size:13px;color:var(--muted)">No goals data for this month.</div>';
  }

  html += '<div class="ts">' + fmtTimestamp() + '</div>';

  el.innerHTML = html;
}

function toggleDbg() {
  dbgOpen = !dbgOpen;
  document.getElementById('dbgpanel').classList.toggle('hidden', !dbgOpen);
  document.getElementById('dbgbtn').classList.toggle('on', dbgOpen);

function switchDbgTab(i) {

  document.querySelectorAll('.dbgtab').forEach(function(t, j) {
    t.classList.toggle('active', j === i);
  });
  if (parsed) renderDbg();
}

function renderDbg() {
  var el = document.getElementById('dbgbody');

    el.innerHTML = '<div class="dbgempty">No data loaded yet.</div>';
    return;
  }
  
  var dbg = parsed._dbg;

      [
        ['Budget header?', dbg.bHdr, 'bool'],
        ['Activity header?', dbg.aHdr, 'bool'],
        ['Snapshot header?', dbg.sHdr, 'bool'],
        ['AccountSnapshot?', dbg.hasAccSnap, 'bool'],
        ['Raw Budget rows', dbg.rawB, 'num'],
        ['Raw Activity rows', dbg.rawA, 'num'],
        ['Budget this month', dbg.bMo, 'w0'],
        ['Activity this month', dbg.aMo, 'w0'],
        ['Categories', dbg.cats, 'w0'],
        ['Expense txns', dbg.expCt, 'num'],
        ['Income txns', dbg.incCt, 'num'],
        ['Reimbursement txns', dbg.reimbCt, 'num'],
        ['Balance rows', dbg.balCt, 'w0']
      ].map(function(c) {
        var cls = c[2] === 'bool' ? (c[1] ? 'ok' : 'bad') : 
                  c[2] === 'w0' ? (c[1] === 0 ? 'bad' : 'ok') : '';
        return '<div class="dbgrow"><span class="dbgk">' + c[0] + '</span>' +
          '<span class="dbgv ' + cls + '">' + 
          (c[1] === true ? 'yes' : c[1] === false ? 'no' : String(c[1])) + 
          '</span></div>';
      }).join('') +
      '</div><div class="dbgsec"><div class="dbgst">Key Values</div><div class="dbggrid">' +
      [
        ['Left to Assign', peso(p.readyToAssign), 'Snapshot col J'],
        ['Total Income', peso(p.totalInc), 'Activity Income txns'],
        ['Gross Expense', peso(p.totalExp), 'Activity Expense txns'],
        ['Reimbursed', peso(p.totalReimb), 'Activity Reimbursement txns'],
        ['Net Spend', peso(p.netExp), 'Gross Expense − Reimbursed'],
        ['Total Assigned', peso(p.totalAssignedAll), 'Budget col L (11) sum'],
        ['Net Worth', peso(p.netWorth), 'AccountSnapshot col J'],
        ['Assigned This Mo', peso(p.assignedThisMonth), 'Snapshot col I']
      ].map(function(x) {
        return '<div class="dbgstat"><div class="dbgslbl">' + x[0] + '</div>' +
          '<div class="dbgsval">' + x[1] + '</div>' +
          '<div style="font-size:9px;color:var(--muted);margin-top:1px">' + x[2] + '</div></div>';
      }).join('') +
      '</div></div>' +
      '<div class="dbgsec"><div class="dbgst">Account Balances (source)</div>' +
      ACCOUNTS.map(function(a) {
        var snap = p.accountSnap[a];
        var b = snap ? snap.cashEnd : (p.accBals[a] || 0);
        var src = snap ? 'snapshot' : 'fallback';
        return '<div class="dbgrow"><span class="dbgk">' + a + '</span>' +
          '<span class="dbgv ' + (b > 0 ? 'ok' : b < 0 ? 'bad' : '') + '">' +
          (b < 0 ? '&#8722;' : '') + peso(Math.abs(b)) +
          ' <span style="font-size:9px;color:' + (snap ? 'var(--income)' : 'var(--warn)') + '">(' + src + ')</span>' +
          '</span></div>';
      }).join('') +
      '</div>' +
      '<div class="dbgsec"><div class="dbgst">AccountSnapshot Raw Keys</div>' +
      (Object.keys(p.accountSnap).length === 0 ?
        '<div class="dbgempty">No AccountSnapshot rows matched this month</div>' :
        Object.keys(p.accountSnap).map(function(k) {
          var s = p.accountSnap[k];
          return '<div class="dbgrow"><span class="dbgk">' + hesc(k) + '</span>' +
            '<span class="dbgv">' + peso(s.cashEnd) + '</span></div>';
        }).join('')) +
      '</div>';
      
  } else if (dbgTab === 1) {
    // Budget
    var s = p._bRows.slice(0, 5);
    var dropTotal = dbg.bDropNoCat + dbg.bDropNoGrp + dbg.bDropNoCatId;
    el.innerHTML = '<div class="dbgsec"><div class="dbgst">Budget Row Pipeline</div>' +
      [
        ['Total rows (excl. header)', dbg.bTotal, 'num'],
        ['No MonthStart date', dbg.bNoDate, dbg.bNoDate > 0 ? 'bad' : ''],
        ['Wrong month', dbg.bMonthMismatch, 'num'],
        ['Matched this month', dbg.bMo, dbg.bMo === 0 ? 'bad' : 'ok'],
        ['Dropped: no Category (col H)', dbg.bDropNoCat, dbg.bDropNoCat > 0 ? 'bad' : ''],
        ['Dropped: no Group (col G)', dbg.bDropNoGrp, dbg.bDropNoGrp > 0 ? 'bad' : ''],
        ['Dropped: no CategoryID (col D)', dbg.bDropNoCatId, dbg.bDropNoCatId > 0 ? 'bad' : ''],
        ['Built into catMap', dbg.bDropOk, dbg.bDropOk === 0 ? 'bad' : 'ok'],
        ['Final categories rendered', dbg.cats, dbg.cats === 0 ? 'bad' : 'ok']
      ].map(function(c) {
        return '<div class="dbgrow"><span class="dbgk">' + c[0] + '</span>' +
          '<span class="dbgv ' + (c[2] || '') + '">' + c[1] + '</span></div>';
      }).join('') +
      '</div>' +
      (dbg.bDroppedRows.length ? '<div class="dbgsec"><div class="dbgst" style="color:var(--expense)">Dropped Rows (' + dropTotal + ')</div>' +
        dbg.bDroppedRows.map(function(pair) {
          var row = pair[0], reason = pair[1];
          return '<div class="dbgrow" style="flex-direction:column;gap:2px;align-items:flex-start">' +
            '<span class="dbgv bad" style="font-size:9px">' + hesc(reason) + '</span>' +
            '<span class="dbgk" style="font-size:8px">catId=' + hesc(String(row[3] || '(blank)')) +
            ' grpId=' + hesc(String(row[2] || '(blank)')) +
            ' cat=' + hesc(String(row[7] || '(blank)')) +
            ' grp=' + hesc(String(row[6] || '(blank)')) +
            ' month=' + hesc(String(row[5] || '(blank)')) + '</span></div>';
        }).join('') +
        '</div>' : '') +
      '<div class="dbgsec"><div class="dbgst">Column Map</div>' +
      [
        ['3 (D)', 'CategoryID — catMap key, required'],
        ['5 (F)', 'MonthStart (date filter)'],
        ['6 (G)', 'Group'],
        ['7 (H)', 'Category'],
        ['9 (J)', 'Monthly Goal'],
        ['11 (L)', 'ManualAssigned (no rollovers)'],
        ['12 (M)', 'AssignedThisMonth / Budgeted (incl. rollovers)'],
        ['13 (N)', 'Activity (negative = spent)'],
        ['14 (O)', 'RolloverPrevMonth'],
        ['15 (P)', 'AvailableThisMonth (hero)'],
        ['16 (Q)', 'NeededThisMonth']
      ].map(function(x) {
        return '<div class="dbgrow"><span class="dbgk">Col ' + x[0] + '</span>' +
          '<span class="dbgv">' + x[1] + '</span></div>';
      }).join('') +
      '</div><div class="dbgsec"><div class="dbgst">First 5 Budget Rows This Month</div>' +
      (s.length === 0 ? '<div class="dbgempty">No rows — check MonthStart parsing</div>' :
        s.map(function(row, i) {
          var pd = parseDate(row[5]);
          return '<div class="dbgrow" style="flex-direction:column;gap:3px;align-items:flex-start">' +
            '<span class="dbgk">Row ' + (i + 1) + ': ' + hesc(String(row[7] || '?')) +
            ' / ' + hesc(String(row[6] || '?')) + '</span>' +
            '<span class="dbgv" style="font-size:9px;text-align:left">' +
            'CatID(3): ' + hesc(String(row[3] || '(blank)')) + '<br>' +
            'MonthStart(5): ' + hesc(String(row[5] || '--')) + ' &rarr; ' +
            (pd ? pd.toLocaleDateString() : '<span style="color:var(--expense)">FAIL</span>') + '<br>' +
            'TotalAssigned(12): ' + String(row[12] || 0) + ' Activity(13): ' + String(row[13] || 0) + '<br>' +
            'Available(15): ' + String(row[15] || 0) + '</span></div>';
        }).join('') +
        '<div class="dbgnote">Col 3 = CategoryID (required). Col 12 = AssignedThisMonth. Col 13 = Activity (spent).</div>') +
      '</div>';
      
  } else if (dbgTab === 2) {
    // Activity
    var s2 = p._mAct.slice(0, 6);
    el.innerHTML = '<div class="dbgsec"><div class="dbgst">Activity Column Map</div>' +
      [
        ['4 (E)', 'CategoryID (join key)'],
        ['5 (F)', 'GroupID'],
        ['6 (G)', 'TransactionDate (display)'],
        ['7 (H)', 'BillingCycle (month filter)'],
        ['8 (I)', 'Type'],
        ['9 (J)', 'Amount'],
        ['10 (K)', 'Merchant'],
        ['11 (L)', 'Payment Method'],
        ['12 (M)', 'Category'],
        ['13 (N)', 'Group'],
        ['14 (O)', 'Memo']
      ].map(function(x) {
        return '<div class="dbgrow"><span class="dbgk">Col ' + x[0] + '</span>' +
          '<span class="dbgv">' + x[1] + '</span></div>';
      }).join('') +
      '</div><div class="dbgsec"><div class="dbgst">First 6 Activity Rows This Month</div>' +
      (s2.length === 0 ? '<div class="dbgempty">No rows - check date parsing</div>' :
        s2.map(function(row, i) {
          var pd = parseDate(row[7]);
          return '<div class="dbgrow" style="flex-direction:column;gap:3px;align-items:flex-start">' +
            '<span class="dbgk">Row ' + (i + 1) + ': ' + String(row[8] || '?') +
            ' &mdash; ' + String(row[10] || '?') + '</span>' +
            '<span class="dbgv" style="font-size:9px;text-align:left">' +
            'BillingCycle(7): ' + String(row[7] || '--') + ' &rarr; ' +
            (pd ? pd.toLocaleDateString() : 'FAIL') + '<br>' +
            'Amount(9): ' + String(row[9] || 0) + ' Payment(11): ' + String(row[11] || '--') + '<br>' +
            'Cat(12): ' + String(row[12] || '--') + ' Group(13): ' + String(row[13] || '--') + '<br>' +
            'Memo(14): ' + String(row[14] || '--') + '</span></div>';
        }).join('') +
        '<div class="dbgnote">Month filter uses col 7 BillingCycle. TransactionDate display is col 6.</div>') +
      '</div>';
      
  } else if (dbgTab === 3) {
    // Snapshot
    el.innerHTML = '<div class="dbgsec"><div class="dbgst">Snapshot Column Map</div>' +
      [
        ['0 (A)', 'MonthStart'],
        ['2 (C)', 'InflowExternal'],
        ['5 (F)', 'TrueExpense (OutflowExternal)'],
        ['6 (G)', 'CashEnd'],
        ['8 (I)', 'AssignedThisMonth'],
        ['9 (J)', 'ReadyToAssignEnd (hero value)']
      ].map(function(x) {
        return '<div class="dbgrow"><span class="dbgk">Col ' + x[0] + '</span>' +
          '<span class="dbgv">' + x[1] + '</span></div>';
      }).join('') +
      '</div><div class="dbgsec"><div class="dbgst">All Snapshot Rows</div>' +
      (p._sData.length === 0 ? '<div class="dbgempty">No rows</div>' :
        p._sData.map(function(row) {
          var dt = parseDate(row[0]);
          var cur = dt && dt.getMonth() === viewMonth.getMonth() && 
                    dt.getFullYear() === viewMonth.getFullYear();
          return '<div class="dbgrow" style="flex-direction:column;gap:3px;align-items:flex-start;' +
            (cur ? 'background:var(--accent-dim);' : '') + '">' +
            '<span class="dbgk">' + String(row[0] || '?') + (cur ? ' (current)' : '') + '</span>' +
            '<span class="dbgv" style="font-size:9px;text-align:left">' +
            'Parsed: ' + (dt ? dt.toLocaleDateString() : 'FAIL') + 
            ' | RTA(J): <strong style="color:var(--warn)">' + String(row[9] || '--') +
            '</strong></span></div>';
        }).join('') +
        '<div class="dbgnote">Col J ReadyToAssignEnd = hero card</div>') +
      '</div>';
  }
}

setML();

// Dynamic tab layout — reads actual page count so adding a page doesn't need JS changes
NUM_PAGES = document.querySelectorAll('#pages .page').length;
document.getElementById('pages').style.width = (NUM_PAGES * 100) + '%';
document.querySelectorAll('#pages .page').forEach(function(p) {
  p.style.width = (100 / NUM_PAGES) + '%';
});

if (!loadCache()) {
  loadData();
} else {
  loadData();
}

// Header is not permanently fixed — it slides away on scroll-down and
// reappears on scroll-up or near the top of whichever page is active.
(function() {
  var hdrEl = document.getElementById('hdr');
  var lastY = {};
  document.querySelectorAll('.page').forEach(function(page) {
    lastY[page.id] = 0;
    page.addEventListener('scroll', function() {
      var y = page.scrollTop;
      var last = lastY[page.id] || 0;
      if (y <= 8) {
        hdrEl.classList.remove('hide');
      } else if (y > last + 4) {
        hdrEl.classList.add('hide');
      } else if (y < last - 4) {
        hdrEl.classList.remove('hide');
      }
      lastY[page.id] = y;
    }, { passive: true });
  });
})();

// Star field
(function() {
  var c = document.getElementById('stars');
  for (var i = 0; i < 300; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 100) + '%';
    s.style.animationDelay = (Math.random() * 5) + 's';
    c.appendChild(s);
  }
})();

</script>
